[package]
name = "snapdir-core"
version = "1.10.0"
edition = "2021"
rust-version = "1.91.1"
authors = ["Bermi Ferrer <bermi@bermilabs.com>"]
license = "MIT"
repository = "https://github.com/bermi/snapdir"
homepage = "https://snapdir.org"
description = "snapdir core: manifest format, BLAKE3 merkle hashing, store trait, walk, cache."
readme = "README.md"

[dependencies]
blake3 = { version = "1.8.5", features = ["mmap", "rayon"] }
libc = "0.2"
md-5 = "0.11"
rayon = "1.12.0"
regex = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
proptest = "1"

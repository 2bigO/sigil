[package]
name = "sigil-cli"
version = "0.9.0"
edition = "2024"
rust-version = "1.91.1"
publish = false

[lib]
name = "sigil_cli"
path = "rust/lib.rs"

[[bin]]
name = "sigil"
path = "rust/main.rs"

[dependencies]
sigil-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2

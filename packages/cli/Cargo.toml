[package]
name = "sigil-cli"
version = "0.9.0"
edition = "2024"
rust-version = "1.91.1"
publish = false

[[bin]]
name = "sigil"
path = "src/main.rs"

[dependencies]
sigil-core = { path = "../core" }
sigil-lsp = { path = "../lsp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2

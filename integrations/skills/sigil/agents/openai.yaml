interface:
  display_name: "Sigil"
  short_description: "Author Sigil and use native scope and semantic gates"
  default_prompt: "Use $sigil. Start with sigilc request status --root .: when an active request exists, its ready item is authoritative; run its persisted scope and frontend capture, and do not create or replace that request. A scope is source selection inside a request item, not a task name. When no request exists, derive scope from authorized work before creating one. Inspect governing contracts, export current Design input when it changed, read the durable compilation execution reference, use sigilc directly, and when reconstruction is required spawn a subagent in the background for each source using that reference's exact isolated prompt; have it write the version-2 evidence manifest with a final pending exit null and run sigilc ingest --evidence, repairing its temporary Turtle from each hint until an exit-0 projection is published before native semantic gates. Never depend on temporary compile.md or track.md instructions."

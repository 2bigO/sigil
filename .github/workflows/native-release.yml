name: Publish native CLI release

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact CLI manifest version to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: native-cli-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            ts-package: '@typescript/typescript-linux-x64'
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            ts-package: '@typescript/typescript-linux-arm64'
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            ts-package: '@typescript/typescript-darwin-x64'
          - target: aarch64-apple-darwin
            runner: macos-15
            ts-package: '@typescript/typescript-darwin-arm64'
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            ts-package: '@typescript/typescript-win32-x64'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}
      - name: Assert runner identity
        shell: bash
        run: |
          deno eval 'console.log(`${Deno.build.os}/${Deno.build.arch}`)'
          case '${{ matrix.target }}' in
            *linux*) test "$(uname -s)" = Linux ;;
            *apple*) test "$(uname -s)" = Darwin ;;
            *windows*) test "$(uname -s)" = MINGW64_NT* || test "${RUNNER_OS}" = Windows ;;
          esac
      - name: Resolve exact TypeScript platform package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/typescript"
          cat > "$RUNNER_TEMP/typescript/package.json" <<'EOF'
          {"private":true,"dependencies":{"${{ matrix.ts-package }}":"7.0.2"}}
          EOF
          npm install --prefix "$RUNNER_TEMP/typescript" --ignore-scripts --no-audit --no-fund '${{ matrix.ts-package }}@7.0.2'
          deno run --allow-read scripts/verify-typescript-platform.ts \
            --package-dir "$RUNNER_TEMP/typescript/node_modules/${{ matrix.ts-package }}" \
            --package-name '${{ matrix.ts-package }}' \
            --lockfile "$RUNNER_TEMP/typescript/package-lock.json" \
            --lock deno.lock
          echo "SIGIL_TYPESCRIPT_PACKAGE_DIR=$RUNNER_TEMP/typescript/node_modules/${{ matrix.ts-package }}" >> "$GITHUB_ENV"
      - name: Build locked native engine
        shell: bash
        run: cargo build --manifest-path packages/compiler/native/Cargo.toml --release --locked --target '${{ matrix.target }}'
      - name: Build, smoke test, and stage archive
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"; if [[ -z "$version" ]]; then version="${GITHUB_REF_NAME#cli-v}"; fi
          deno run --allow-read --allow-write --allow-run --allow-env scripts/build-cli-release.ts --target '${{ matrix.target }}' --version "$version" --output "$RUNNER_TEMP/release"
          mkdir -p "release-${{ matrix.target }}"
          cp "$RUNNER_TEMP/release"/* "release-${{ matrix.target }}/"
          printf '%s\n' '{"target":"${{ matrix.target }}","status":"smoke-tested"}' > "release-${{ matrix.target }}/test-summary.json"
      - name: Build source-independent artifact consumer
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" = Windows ]]; then
            consumer="$RUNNER_TEMP/release-consumer.exe"
          else
            consumer="$RUNNER_TEMP/release-consumer"
          fi
          rustc --edition 2021 -O scripts/fixtures/release-consumer/main.rs -o "$consumer"
          mkdir -p "release-${{ matrix.target }}/consumer" "release-${{ matrix.target }}/fixture/project"
          cp "$consumer" "release-${{ matrix.target }}/consumer/"
          cp scripts/fixtures/release/project/main.sigil "release-${{ matrix.target }}/fixture/project/"
          cp scripts/fixtures/release/project/fixture-config.json "release-${{ matrix.target }}/fixture/project/"
      - name: Offline Linux x64 archive smoke
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then version="${GITHUB_REF_NAME#cli-v}"; fi
          docker run --rm --network none \
            -e "SIGIL_RELEASE_VERSION=$version" \
            -v "$RUNNER_TEMP/release:/release:ro" \
            -v "$GITHUB_WORKSPACE/scripts/fixtures/release:/fixtures:ro" \
            ubuntu:24.04 bash -eu -o pipefail -s <<'EOF'
          mkdir -p /tmp/sigil /tmp/fixture/.sigil
          tar -xzf /release/sigil-x86_64-unknown-linux-gnu.tar.gz -C /tmp/sigil
          cli="/tmp/sigil/sigil-$SIGIL_RELEASE_VERSION/bin/sigil"
          test -x "$cli"
          test "$("$cli" --version)" = "$SIGIL_RELEASE_VERSION"
          "$cli" doctor --format json | grep -q '"ok":true'
          cp /fixtures/project/main.sigil /tmp/fixture/main.sigil
          cp /fixtures/project/fixture-config.json /tmp/fixture/.sigil/config.json
          "$cli" semantic status /tmp/fixture --format json | grep -q '"status":"yellow"'
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: sigil-release-${{ matrix.target }}
          path: release-${{ matrix.target }}
          if-no-files-found: error

  artifact-consumer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sigil-release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-artifact
      - name: Assert runner identity
        shell: bash
        run: |
          case '${{ matrix.target }}' in
            *linux*) test "$(uname -s)" = Linux ;;
            *apple*) test "$(uname -s)" = Darwin ;;
            *windows*) test "${RUNNER_OS}" = Windows ;;
          esac
      - name: Extract tested archive
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/release-artifact"
          archive="$(find "$artifact" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | head -n 1)"
          test -n "$archive"
          extracted="$RUNNER_TEMP/release-extracted"
          mkdir -p "$extracted"
          if [[ "$archive" = *.zip ]]; then
            tar -xf "$archive" -C "$extracted"
          else
            tar -xzf "$archive" -C "$extracted"
          fi
          distribution="$(find "$extracted" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$distribution"
          consumer="$(find "$artifact/consumer" -maxdepth 1 -type f | head -n 1)"
          test -n "$consumer"
          fixture="$artifact/fixture/project"
          test -f "$fixture/main.sigil"
          test -f "$fixture/fixture-config.json"
          if [[ "${RUNNER_OS}" != Windows ]]; then
            chmod +x "$consumer"
          fi
          "$consumer" --distribution "$distribution" --fixture "$fixture"

  publish:
    needs: [build, artifact-consumer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sigil-release-*
          merge-multiple: true
          path: build/release
      - name: Combine checksums and installers
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"; if [[ -z "$version" ]]; then version="${GITHUB_REF_NAME#cli-v}"; fi
          find build/release -name checksums.txt -delete
          for asset in build/release/*.tar.gz build/release/*.zip; do
            [[ -f "$asset" ]] || continue
            sha256sum "$asset"
          done | sort -k2 > build/release/checksums.txt
          sed "s/__SIGIL_VERSION__/$version/g" install.sh > build/release/install.sh
          sed "s/__SIGIL_VERSION__/$version/g" install.ps1 > build/release/install.ps1
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          version="$VERSION"; version="${version#cli-v}"
          tag="cli-v$version"
          gh release create "$tag" \
            build/release/*.tar.gz build/release/*.zip \
            build/release/checksums.txt build/release/install.sh build/release/install.ps1 \
            --verify-tag --title "Sigil CLI $version" --generate-notes --latest
